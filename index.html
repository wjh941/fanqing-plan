<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="返青计划" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="返青计划 · 断更账号重启与陪伴工具——基于你自己的历史作品数据,生成重启诊断、低风险选题、双平台文案与渐进式排期。停更是蓄力,不是终点。内容策略辅助工具,不承诺流量效果。"
    />
    <title>返青计划 · 断更账号重启与陪伴工具</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 兼容性兜底:任何加载/运行错误直接显示在屏幕上,方便老设备排查
      window.addEventListener(
        'error',
        function (e) {
          var el = document.getElementById('boot-error')
          if (!el) {
            el = document.createElement('div')
            el.id = 'boot-error'
            el.style.cssText =
              'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#fee2e2;color:#991b1b;font:12px/1.6 sans-serif;padding:8px 10px;white-space:pre-wrap;word-break:break-all'
            if (document.body) document.body.appendChild(el)
          }
          var src = e.target && (e.target.src || e.target.href)
          el.textContent =
            '加载出错,请截图发给开发者:' + (e.message || src || 'unknown')
        },
        true,
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
