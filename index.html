<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="返青计划" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="返青计划 · 断更账号重启与陪伴工具——基于你自己的历史作品数据,生成重启诊断、低风险选题、双平台文案与渐进式排期。停更是蓄力,不是终点。内容策略辅助工具,不承诺流量效果。"
    />
    <title>返青计划 · 断更账号重启与陪伴工具</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 兼容性兜底:加载/运行错误直接显示在屏幕上,并附带"页面 + JS 包指纹",便于远程诊断
      ;(function () {
        function show(msg) {
          var el = document.getElementById('boot-error')
          if (!el) {
            el = document.createElement('div')
            el.id = 'boot-error'
            el.style.cssText =
              'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#fee2e2;color:#991b1b;font:12px/1.6 sans-serif;padding:8px 10px;white-space:pre-wrap;word-break:break-all'
            ;(document.body || document.documentElement).appendChild(el)
          }
          if (el.getAttribute('data-seen') === '1') return
          el.setAttribute('data-seen', '1')
          var bundle = '?'
          try {
            var s = document.querySelector('script[src*="assets"]')
            if (s) bundle = s.getAttribute('src')
          } catch (e2) {}
          el.textContent =
            '加载出错,请整屏截图发给开发者\n错误:' +
            msg +
            '\n页面:' +
            location.pathname +
            location.search +
            '\n包:' +
            bundle +
            '\n时间:' +
            new Date().toLocaleTimeString()
        }
        window.__showBootError = show
        // 捕获 React 等库的 console.error(内含组件名提示),供红条展示
        var lastCE = ''
        var origCE = console.error
        console.error = function () {
          try {
            lastCE = Array.prototype.map
              .call(arguments, function (a) {
                return typeof a === 'string' ? a : String(a && a.message ? a.message : a)
              })
              .join(' ')
          } catch (e3) {}
          return origCE.apply(console, arguments)
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && t !== window && (t.src || t.href)) {
              show('资源加载失败:' + (t.src || t.href))
            } else {
              show((e.message || 'unknown') + (e.lineno ? ' @L' + e.lineno : '') + (lastCE ? '\n细节:' + lastCE.slice(0, 600) : ''))
            }
          },
          true,
        )
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length === 0) {
            show('页面 5 秒未加载完成。多半是缓存了旧版本:请下拉刷新重试,或在浏览器菜单里选「在浏览器打开/清除缓存」。')
          }
        }, 5000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
